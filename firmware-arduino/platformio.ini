[platformio]
default_envs = m5stack-cardputer

[env]
platform = espressif32 @ 6.10.0
framework = arduino
monitor_speed = 115200

lib_deps = 
    bblanchon/ArduinoJson@^7.1.0
    links2004/WebSockets@^2.4.1
    ESP32Async/ESPAsyncWebServer@^3.7.6
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/arduino-libopus.git#a1.1.0

board_build.filesystem = spiffs
board_build.partitions = partition.csv
upload_protocol = esptool
monitor_filters =
  esp32_exception_decoder
  time
build_unflags = -std=gnu++11

build_flags = 
    -std=gnu++17
    -D NODEBUG_WEBSOCKETS=1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    ${env.lib_deps}
    https://github.com/esp-arduino-libs/ESP32_Button.git#v0.0.1
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=5
    -D DEBUG_ESP_PORT=Serial
    -D TOUCH_SENSOR_ENABLE=1        ; Enable touch sensor driver

[env:m5stack-cardputer]
board = esp32-s3-devkitc-1
upload_speed = 1500000
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    z3t0/IRremote@4.7.1
    https://github.com/m5stack/M5Cardputer.git#1.2.0
build_flags =
    ${env.build_flags}
    -D ELATO_CARDPUTER=1
    -D VAR_ARRAYS=1
    -D CORE_DEBUG_LEVEL=3
    -D DEBUG_ESP_PORT=Serial
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
